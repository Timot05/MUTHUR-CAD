<!doctype html>
<meta charset="utf-8">
<title>mk52 board</title>
<!-- A board drawn by the graphics card (WebGPU). mk52 board <model> view writes this page with the
     board in it, in place of the null below: every piece of copper as a shape of a few
     numbers (a line with a width, an arc with a width, a rectangle with rounded
     corners), its layer and its net. Each is a small rectangle on the screen whose
     pixels work out how far inside the shape they are, so an edge is sharp at any
     size. Nothing is fetched: the page is the one file. -->
<style>
  html, body { margin: 0; height: 100%; background: #14171c; color: #d8dbe0; font: 13px system-ui, sans-serif; overflow: hidden }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; cursor: crosshair }
  #bar, #say { position: fixed; left: 10px; background: #000b; padding: 8px 10px; border-radius: 6px }
  #bar { top: 10px } #say { bottom: 10px; max-width: 80vw }
  #bar b { display: block; margin-bottom: 4px } label { display: block; cursor: pointer }
  #bar small { display: block; margin-top: 6px; color: #8a909a }
</style>
<canvas id="c"></canvas>
<div id="bar"></div>
<div id="say"></div>
<script>
const board = /*BOARD*/null

const shader = /* wgsl */`
struct U { view: vec4f, size: vec4f, la: vec4f, lb: vec4f };
@group(0) @binding(0) var<uniform> u: U;

// how much of a layer shows: what goes through the board always does
fn shows(layer: f32) -> f32 {
  if (layer < 0.) { return 1.; }
  let i = i32(layer);
  if (i < 4) { return u.la[i]; }
  return u.lb[i - 4];
}
fn clip(w: vec2f) -> vec4f { return vec4f((w - u.view.xy) * u.view.z / (0.5 * u.size.xy), 0., 1.); }

struct V {
  @builtin(position) pos: vec4f,
  @location(0) w: vec2f,
  @location(1) @interpolate(flat) a: vec4f,
  @location(2) @interpolate(flat) b: vec4f,
  @location(3) @interpolate(flat) col: vec4f,
};

@vertex fn copper_v(@builtin(vertex_index) vi: u32, @location(0) box: vec4f, @location(1) a: vec4f, @location(2) b: vec4f, @location(3) col: vec4f) -> V {
  var cx = array<f32, 6>(0., 1., 0., 0., 1., 1.);
  var cy = array<f32, 6>(0., 0., 1., 1., 0., 1.);
  let room = 1.5 / u.view.z;
  let w = vec2f(mix(box.x - room, box.z + room, cx[vi]), mix(box.y - room, box.w + room, cy[vi]));
  var o: V;
  o.pos = clip(w); o.w = w; o.a = a; o.b = b; o.col = col;
  return o;
}

// how far inside a shape a point is (below zero): b.z says which shape
fn inside(p: vec2f, a: vec4f, b: vec4f) -> f32 {
  if (b.z < 0.5) {                       // a line from a.xy to a.zw, b.x half its width
    let pa = p - a.xy; let ba = a.zw - a.xy; let l = dot(ba, ba);
    var h = 0.;
    if (l > 0.) { h = clamp(dot(pa, ba) / l, 0., 1.); }
    return length(pa - ba * h) - b.x;
  }
  if (b.z < 1.5) {                       // a rectangle about a.xy, a.zw half its sides, b.x its corners, b.y its turn
    let c = cos(b.y); let s = sin(b.y); let d = p - a.xy;
    let q = vec2f(c * d.x + s * d.y, -s * d.x + c * d.y);
    let e = abs(q) - (a.zw - vec2f(b.x));
    return length(max(e, vec2f(0.))) + min(max(e.x, e.y), 0.) - b.x;
  }
  let q = p - a.xy;                      // an arc about a.xy of radius a.z, a.w half its width, from b.x through b.y
  let turn = 6.283185307;
  var t = atan2(q.y, q.x) - b.x;
  t = t - turn * floor(t / turn);
  if (t <= b.y) { return abs(length(q) - a.z) - a.w; }
  let e1 = a.xy + a.z * vec2f(cos(b.x), sin(b.x));
  let e2 = a.xy + a.z * vec2f(cos(b.x + b.y), sin(b.x + b.y));
  return min(distance(p, e1), distance(p, e2)) - a.w;
}

@fragment fn copper_f(v: V) -> @location(0) vec4f {
  var full = clamp(0.5 - inside(v.w, v.a, v.b) * u.view.z, 0., 1.) * shows(v.b.w);
  var c = v.col.rgb;
  // a net picked out: brighter, and the rest faint (a hole stays as it is)
  if (u.view.w > -0.5 && v.col.a > -1.5) {
    if (abs(v.col.a - u.view.w) < 0.5) { c = mix(c, vec3f(1.), 0.3); } else { full = full * 0.16; }
  }
  if (full <= 0.) { discard; }
  return vec4f(c, full);
}

struct Flat { @builtin(position) at: vec4f, @location(0) cut: f32 };
@vertex fn flat_v(@location(0) w: vec3f) -> Flat { return Flat(clip(w.xy), w.z); }
// the board, or an opening cut in it, which is the ground's colour
@fragment fn flat_f(f: Flat) -> @location(0) vec4f { return mix(vec4f(0.094, 0.196, 0.153, 1.), vec4f(0.078, 0.09, 0.11, 1.), step(0.5, f.cut)); }

// a pour: the formula's value at the middles of small cells, read between them
struct P { place: vec4f, grid: vec4f, col: vec4f };
@group(1) @binding(0) var<uniform> pour: P;
@group(1) @binding(1) var cells: texture_2d<f32>;
struct PV { @builtin(position) pos: vec4f, @location(0) w: vec2f };
@vertex fn pour_v(@builtin(vertex_index) vi: u32) -> PV {
  var cx = array<f32, 6>(0., 1., 0., 0., 1., 1.);
  var cy = array<f32, 6>(0., 0., 1., 1., 0., 1.);
  let w = pour.place.xy + vec2f(cx[vi], cy[vi]) * pour.grid.xy * pour.place.z;
  var o: PV; o.pos = clip(w); o.w = w; return o;
}
fn cell(i: i32, j: i32) -> f32 {
  let n = vec2i(pour.grid.xy);
  if (i < 0 || j < 0 || i >= n.x || j >= n.y) { return 1e6; }
  return textureLoad(cells, vec2i(i, j), 0).r;
}
@fragment fn pour_f(v: PV) -> @location(0) vec4f {
  let g = (v.w - pour.place.xy) / pour.place.z - vec2f(0.5);
  let i = i32(floor(g.x)); let j = i32(floor(g.y)); let f = g - floor(g);
  let value = mix(mix(cell(i, j), cell(i + 1, j), f.x), mix(cell(i, j + 1), cell(i + 1, j + 1), f.x), f.y);
  var full = clamp(0.5 - value * u.view.z, 0., 1.) * shows(pour.place.w) * pour.col.w;
  if (u.view.w > -0.5) { if (abs(pour.grid.z - u.view.w) < 0.5) { full = full * 1.5; } else { full = full * 0.25; } }
  if (full <= 0.) { discard; }
  return vec4f(pour.col.rgb, full);
}`

const say = document.getElementById('say'), bar = document.getElementById('bar')
const floats = text => new Float32Array(Uint8Array.from(atob(text), c => c.charCodeAt(0)).buffer)

// a polygon cut into triangles, ears first
function triangles(P) {
  const side = (a, b, c) => (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0])
  const within = (p, a, b, c) => side(a, b, p) >= 0 && side(b, c, p) >= 0 && side(c, a, p) >= 0
  const left = P.map((_, i) => i), out = []
  let tries = 0
  while (left.length > 3 && tries++ < 200000) {
    let cut = false
    for (let i = 0; i < left.length; i++) {
      const ia = left[(i + left.length - 1) % left.length], ib = left[i], ic = left[(i + 1) % left.length]
      if (side(P[ia], P[ib], P[ic]) <= 0) continue
      if (left.some(j => j !== ia && j !== ib && j !== ic && within(P[j], P[ia], P[ib], P[ic]))) continue
      out.push(ia, ib, ic); left.splice(i, 1); cut = true; break
    }
    if (!cut) break
  }
  if (left.length === 3) out.push(...left)
  return out
}

async function main() {
  if (!board) { say.textContent = 'There is no board in this page: mk52 board <model> view writes one with it.'; return }
  if (!navigator.gpu) { say.textContent = 'This browser has no WebGPU, which this page draws with.'; return }
  const adapter = await navigator.gpu.requestAdapter()
  if (!adapter) { say.textContent = 'WebGPU is here but gave no graphics card to draw with.'; return }
  const device = await adapter.requestDevice()
  const canvas = document.getElementById('c'), ctx = canvas.getContext('webgpu'), format = navigator.gpu.getPreferredCanvasFormat()
  ctx.configure({ device, format, alphaMode: 'opaque' })
  const module = device.createShaderModule({ code: shader })
  const over = { color: { srcFactor: 'src-alpha', dstFactor: 'one-minus-src-alpha' }, alpha: { srcFactor: 'one', dstFactor: 'one-minus-src-alpha' } }

  const uniforms = device.createBuffer({ size: 64, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST })
  const shared = device.createBindGroupLayout({ entries: [{ binding: 0, visibility: GPUShaderStage.VERTEX | GPUShaderStage.FRAGMENT, buffer: {} }] })
  const group = device.createBindGroup({ layout: shared, entries: [{ binding: 0, resource: { buffer: uniforms } }] })

  // the copper: sixteen numbers a piece
  const inst = floats(board.instances), count = inst.length / 16
  const pieces = device.createBuffer({ size: Math.max(64, inst.byteLength), usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST })
  device.queue.writeBuffer(pieces, 0, inst)
  const copper = device.createRenderPipeline({
    layout: device.createPipelineLayout({ bindGroupLayouts: [shared] }),
    vertex: { module, entryPoint: 'copper_v', buffers: [{ arrayStride: 64, stepMode: 'instance', attributes: [0, 1, 2, 3].map(k => ({ shaderLocation: k, offset: 16 * k, format: 'float32x4' })) }] },
    fragment: { module, entryPoint: 'copper_f', targets: [{ format, blend: over }] },
  })

  // the board itself
  const sides = (loop, cut) => triangles(loop).flatMap(i => [...loop[i], cut])
  const area = loop => loop.reduce((s, p, i) => { const q = loop[(i + 1) % loop.length]; return s + p[0] * q[1] - q[0] * p[1] }, 0)
  // every loop goes round counter-clockwise for the cutting into triangles
  const ccw = loop => (area(loop) < 0 ? [...loop].reverse() : loop)
  const shape = new Float32Array([...sides(ccw(board.outline), 0), ...(board.cuts || []).flatMap(c => sides(ccw(c), 1))]), tri = { length: shape.length / 3 }
  const outline = device.createBuffer({ size: Math.max(8, shape.byteLength), usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST })
  device.queue.writeBuffer(outline, 0, shape)
  const flat = device.createRenderPipeline({
    layout: device.createPipelineLayout({ bindGroupLayouts: [shared] }),
    vertex: { module, entryPoint: 'flat_v', buffers: [{ arrayStride: 12, attributes: [{ shaderLocation: 0, offset: 0, format: 'float32x3' }] }] },
    fragment: { module, entryPoint: 'flat_f', targets: [{ format }] },
  })

  // the pours
  const poured = device.createBindGroupLayout({ entries: [{ binding: 0, visibility: GPUShaderStage.VERTEX | GPUShaderStage.FRAGMENT, buffer: {} }, { binding: 1, visibility: GPUShaderStage.FRAGMENT, texture: { sampleType: 'unfilterable-float' } }] })
  const pouring = device.createRenderPipeline({
    layout: device.createPipelineLayout({ bindGroupLayouts: [shared, poured] }),
    vertex: { module, entryPoint: 'pour_v' },
    fragment: { module, entryPoint: 'pour_f', targets: [{ format, blend: over }] },
  })
  const pours = board.pours.map(p => {
    const texture = device.createTexture({ size: [p.nx, p.ny], format: 'r32float', usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST })
    device.queue.writeTexture({ texture }, floats(p.values), { bytesPerRow: 4 * p.nx }, [p.nx, p.ny])
    const buffer = device.createBuffer({ size: 48, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST })
    device.queue.writeBuffer(buffer, 0, new Float32Array([p.x0, p.y0, p.cell, p.layer, p.nx, p.ny, p.net, 0, ...p.colour, p.solid ? 1 : 0.5]))
    return device.createBindGroup({ layout: poured, entries: [{ binding: 0, resource: { buffer } }, { binding: 1, resource: texture.createView() }] })
  })

  // what is looked at: the middle, how many pixels a millimetre, the net picked out, the layers shown
  const [x0, y0, x1, y1] = board.box
  const view = { x: (x0 + x1) / 2, y: (y0 + y1) / 2, scale: 1, net: -1, layers: board.layers.map(() => true) }
  let dirty = true
  const size = () => {
    const ratio = window.devicePixelRatio || 1
    canvas.width = Math.max(1, Math.round(canvas.clientWidth * ratio)); canvas.height = Math.max(1, Math.round(canvas.clientHeight * ratio))
    dirty = true
  }
  const fit = () => { view.x = (x0 + x1) / 2; view.y = (y0 + y1) / 2; view.scale = 0.94 * Math.min(canvas.width / (x1 - x0), canvas.height / (y1 - y0)); dirty = true }
  size(); fit()
  addEventListener('resize', size)

  const draw = () => {
    requestAnimationFrame(draw)
    if (!dirty) return
    dirty = false
    const shown = Array.from({ length: 8 }, (_, i) => (view.layers[i] ? (i === 0 ? 1 : 0.6) : 0))
    device.queue.writeBuffer(uniforms, 0, new Float32Array([view.x, view.y, view.scale, view.net, canvas.width, canvas.height, 0, 0, ...shown]))
    const encoder = device.createCommandEncoder()
    const pass = encoder.beginRenderPass({ colorAttachments: [{ view: ctx.getCurrentTexture().createView(), clearValue: { r: 0.078, g: 0.09, b: 0.11, a: 1 }, loadOp: 'clear', storeOp: 'store' }] })
    pass.setBindGroup(0, group)
    if (tri.length) { pass.setPipeline(flat); pass.setVertexBuffer(0, outline); pass.draw(tri.length) }
    if (pours.length) { pass.setPipeline(pouring); for (const p of pours) { pass.setBindGroup(1, p); pass.draw(6) } }
    if (count) { pass.setPipeline(copper); pass.setVertexBuffer(0, pieces); pass.draw(6, count) }
    pass.end()
    device.queue.submit([encoder.finish()])
  }

  // where on the board a place on the screen is
  const world = e => {
    const ratio = canvas.width / canvas.clientWidth
    return [view.x + (e.clientX * ratio - canvas.width / 2) / view.scale, view.y - (e.clientY * ratio - canvas.height / 2) / view.scale]
  }
  // the same working out as the shader's, for what is under the pointer: the topmost piece there
  const inside = (p, i) => {
    const o = 16 * i, a = inst.subarray(o + 4, o + 8), b = inst.subarray(o + 8, o + 12)
    if (b[2] < 0.5) {
      const pax = p[0] - a[0], pay = p[1] - a[1], bax = a[2] - a[0], bay = a[3] - a[1], l = bax * bax + bay * bay
      const h = l > 0 ? Math.min(1, Math.max(0, (pax * bax + pay * bay) / l)) : 0
      return Math.hypot(pax - bax * h, pay - bay * h) - b[0]
    }
    if (b[2] < 1.5) {
      const c = Math.cos(b[1]), s = Math.sin(b[1]), dx = p[0] - a[0], dy = p[1] - a[1]
      const ex = Math.abs(c * dx + s * dy) - (a[2] - b[0]), ey = Math.abs(-s * dx + c * dy) - (a[3] - b[0])
      return Math.hypot(Math.max(ex, 0), Math.max(ey, 0)) + Math.min(Math.max(ex, ey), 0) - b[0]
    }
    const qx = p[0] - a[0], qy = p[1] - a[1], turn = 2 * Math.PI
    let t = Math.atan2(qy, qx) - b[0]; t -= turn * Math.floor(t / turn)
    if (t <= b[1]) return Math.abs(Math.hypot(qx, qy) - a[2]) - a[3]
    const end = at => Math.hypot(p[0] - (a[0] + a[2] * Math.cos(at)), p[1] - (a[1] + a[2] * Math.sin(at)))
    return Math.min(end(b[0]), end(b[0] + b[1])) - a[3]
  }
  const under = p => {
    for (let i = count - 1; i >= 0; i--) {
      const o = 16 * i, layer = inst[o + 11]
      if (layer >= 0 && !view.layers[layer]) continue
      if (p[0] < inst[o] || p[0] > inst[o + 2] || p[1] < inst[o + 1] || p[1] > inst[o + 3]) continue
      if (inside(p, i) <= 0) return i
    }
    return -1
  }
  const told = () => `${board.name}: ${count} pieces of copper, ${board.nets.length} nets, ${board.layers.length} layers. Drag to move, wheel to come nearer, click a net to pick it out.`
  say.textContent = told()

  let held = null, moved = false
  canvas.addEventListener('pointerdown', e => { held = [e.clientX, e.clientY]; moved = false; canvas.setPointerCapture(e.pointerId) })
  canvas.addEventListener('pointerup', e => {
    if (!moved) { const i = under(world(e)), net = i < 0 ? -1 : inst[16 * i + 15]; view.net = net >= 0 && net !== view.net ? net : -1; dirty = true }
    held = null
  })
  canvas.addEventListener('pointermove', e => {
    if (held) {
      const ratio = canvas.width / canvas.clientWidth
      if (Math.abs(e.clientX - held[0]) + Math.abs(e.clientY - held[1]) > 2) moved = true
      view.x -= (e.clientX - held[0]) * ratio / view.scale; view.y += (e.clientY - held[1]) * ratio / view.scale
      held = [e.clientX, e.clientY]; dirty = true
      return
    }
    const p = world(e), i = under(p)
    const net = i < 0 ? -1 : inst[16 * i + 15]
    say.textContent = i < 0 ? told() : `${board.names[i]}${net >= 0 ? ' on ' + board.nets[net] : net < -1.5 ? '' : ', on no net'} at (${p[0].toFixed(2)}, ${p[1].toFixed(2)})`
  })
  canvas.addEventListener('wheel', e => {
    e.preventDefault()
    const before = world(e)
    view.scale *= Math.exp(-e.deltaY * 0.0015)
    const after = world(e)
    view.x += before[0] - after[0]; view.y += before[1] - after[1]; dirty = true
  }, { passive: false })
  addEventListener('keydown', e => { if (e.key === 'f' || e.key === '0') fit(); if (e.key === 'Escape') { view.net = -1; dirty = true } })

  const title = document.createElement('b'); title.textContent = board.name; bar.append(title)
  board.layers.forEach((name, i) => {
    const label = document.createElement('label'), box = document.createElement('input')
    box.type = 'checkbox'; box.checked = true
    box.addEventListener('change', () => { view.layers[i] = box.checked; dirty = true })
    label.append(box, ' ' + name); bar.append(label)
  })
  const hint = document.createElement('small'); hint.textContent = 'f: all of it. Esc: no net picked out.'; bar.append(hint)

  // for whoever drives the page from outside
  window.board_view = { view, fit, redraw: () => { dirty = true }, under, count }
  draw()
}
main().catch(why => { say.textContent = 'It could not be drawn: ' + why })
</script>
